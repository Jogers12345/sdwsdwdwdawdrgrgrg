[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsee"
version = "1.0.0"
description = "Binary Structure Exploration Engine"
authors = [
    {name = "BSEE Development Team", email = "dev@bsee.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "tqdm>=4.62.0",
    "pandas>=1.3.0",
    "jsonschema>=4.0.0",
    "python-dotenv>=0.19.0",
    "marshmallow>=3.13.0",
    "python-magic>=0.4.24",
    "chardet>=4.0.0",
    "lz4>=3.1.0",
    "zstandard>=0.15.0",
    "psutil>=5.8.0",
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.5.0",
    "pillow>=8.0.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "tensorflow>=2.6.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-asyncio>=0.15.0",
    "pytest-cov>=2.12.0",
    "pytest-mock>=3.6.0",
    "pytest-xdist>=2.4.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=2.13.0",
    "ipython>=7.25.0",
    "jupyter>=1.0.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
]
web = [
    "fastapi>=0.68.0",
    "uvicorn[standard]>=0.15.0",
    "python-multipart>=0.0.5",
    "aiofiles>=0.7.0",
    "jinja2>=3.0.0",
]
database = [
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "redis>=3.5.0",
    "psycopg2-binary>=2.9.0",
]
monitoring = [
    "prometheus-client>=0.11.0",
    "structlog>=21.1.0",
]
async-extra = [
    "asyncio-mqtt>=0.10.0",
    "celery>=5.2.0",
]
security = [
    "passlib[bcrypt]>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.4",
    "limiter>=1.4.0",
]
performance = [
    "numba>=0.54.0",
    "cython>=0.29.0",
    "orjson>=3.6.0",
]
deployment = [
    "gunicorn>=20.1.0",
]
all = [
    "bsee[gui,ml,dev,docs,web,database,monitoring,async-extra,security,performance,deployment]",
]

[project.scripts]
bsee = "legacy.main:main"

[project.urls]
Homepage = "https://github.com/bsee/bsee"
Repository = "https://github.com/bsee/bsee"
Documentation = "https://bsee.readthedocs.io"
"Bug Tracker" = "https://github.com/bsee/bsee/issues"

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
bsee = ["config/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "magic.*",
    "chardet.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/site-packages/*",
    "*/distutils/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]