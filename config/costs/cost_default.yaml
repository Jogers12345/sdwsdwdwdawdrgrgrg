name: "Default Cost Model"
description: "Balanced cost model with standard operation pricing"

# Base costs for each operation
base_costs:
  # Bitwise operations (low cost)
  xor_constant: 1.0
  xor_range: 2.0
  not_bytes: 1.0
  and_constant: 1.5
  or_constant: 1.5
  rotate_left: 1.5
  rotate_right: 1.5
  shift_left: 1.0
  shift_right: 1.0
  swap_nibbles: 2.0
  swap_bits: 2.5
  reverse_bits: 2.0
  clear_bit: 1.0
  set_bit: 1.0
  toggle_bit: 1.5
  mask_bits: 1.5
  extract_high_nibble: 3.0
  extract_low_nibble: 3.0
  interleave_bits: 5.0
  deinterleave_bits: 5.0

  # Reordering operations (low to medium cost)
  reverse_bytes: 2.0
  shuffle_bytes: 4.0
  byte_swap: 3.0
  block_reverse: 3.0
  rotate_bytes: 2.5
  transpose_2d: 4.0
  perfect_shuffle: 4.0
  unshuffle: 4.0
  bitonic_sort: 6.0
  block_shuffle: 5.0
  interleave_blocks: 5.0
  deinterleave_blocks: 5.0

  # Delta operations (medium cost)
  delta_encode: 3.0
  delta_decode: 3.0
  adaptive_delta: 4.0
  predictive_delta: 4.0
  differential_encode: 3.5
  cumulative_delta: 3.5
  zigzag_delta: 4.0
  block_delta: 3.5
  windowed_delta: 4.0

  # Substitution operations (medium cost)
  caesar_cipher: 2.5
  affine_transform: 4.0
  vigenere_cipher: 3.5
  xor_key: 3.0
  byte_substitution: 4.0
  sbox_substitution: 4.0
  custom_sbox: 5.0
  multiplicative_key: 3.5
  additive_key: 3.0
  rotating_key: 3.5

  # Transform operations (medium to high cost)
  burrows_wheeler: 6.0
  burrows_wheeler_inverse: 6.0
  bitplane_extract: 5.0
  bitplane_insert: 5.0
  move_to_front: 4.0
  walsh_hadamard: 5.5
  dct_transform: 8.0
  dwt_transform: 8.0
  fft_transform: 8.0

  # Custom operations (variable cost)
  base64_encode: 4.0
  base64_decode: 4.0
  dna_encoding: 6.0
  dna_decoding: 6.0
  data_embedding: 7.0
  checksum_add: 2.0
  encryption_custom: 6.0
  error_correction: 5.0

# Cost modifiers
cost_modifiers:
  # Frequency penalty - cost increases with repeated use
  frequency_penalty:
    enabled: true
    rate: 0.1      # 10% increase per use
    max_multiplier: 5.0  # Maximum cost multiplier

  # Diminishing returns - cost increases if operation not helping
  diminishing_return:
    enabled: true
    rate: 0.05     # 5% increase if not effective
    effectiveness_window: 10  # Check last 10 uses
    min_effectiveness: 0.1   # Threshold for considering effective

  # Novelty bonus - cost decreases for rarely used operations
  novelty_bonus:
    enabled: true
    rate: -0.2     # 20% discount for operations used < 5 times
    usage_threshold: 5
    max_discount: 0.5  # Maximum 50% discount

  # Early stage bonus - cheaper costs in early iterations
  early_stage_bonus:
    enabled: true
    discount_rate: 0.5
    threshold_iterations: 100  # First 100 operations get discount

  # Convergence penalty - increase costs when near convergence
  convergence_penalty:
    enabled: true
    penalty_rate: 0.15
    no_improvement_threshold: 50

# Dynamic cost adjustment
dynamic_adjustment:
  enabled: true
  learning_rate: 0.1
  performance_window: 50  # Consider last 50 operations
  min_cost: 0.1
  max_cost: 50.0

# Category-based cost adjustments
category_adjustments:
  bitwise: 1.0      # No adjustment
  reordering: 1.0
  delta: 1.0
  substitution: 1.0
  transform: 1.2     # 20% more expensive
  custom: 1.1        # 10% more expensive