name: "Enhanced Default Policy"
description: "Comprehensive default operational policy with robust decision-making and quality assurance"

# Metrics to calculate (use "all" for all metrics or specific list)
metrics_to_calculate:
  - file_ideality_score
  - entropy_global
  - lz77_ratio
  - autocorrelation_avg
  - pattern_richness
  - structure_regularity
  - compression_efficiency

# Enhanced decision policies
decision_policies:
  # Resource allocation strategy
  resource_allocation:
    strategy: "adaptive"
    min_resources: 10
    max_resources: 100
    scaling_factor: 1.5
    allocation_method: "performance_based"
    reallocation_threshold: 0.8

  # Timeout handling with progressive backoff
  timeout_handling:
    default_timeout: 300
    progressive_backoff: true
    max_retries: 3
    backoff_factor: 2.0
    timeout_scaling: "exponential"
    retry_delay_base: 1.0

  # Quality assurance mechanisms
  quality_assurance:
    validation_frequency: 100
    error_threshold: 0.05
    auto_correction: true
    rollback_on_failure: true
    validation_methods: ["statistical", "heuristic", "cross_validation"]
    quality_metrics: ["accuracy", "consistency", "robustness"]

  # Performance monitoring and alerting
  performance_monitoring:
    sampling_rate: 0.1
    alert_thresholds:
      cpu: 80.0
      memory: 90.0
      response_time: 5.0
      error_rate: 0.05
    monitoring_intervals:
      real_time: 1.0
      aggregated: 60.0
      historical: 3600.0

# Weights for scoring (-100 to +100)
metric_weights:
  # File Ideality metrics (high priority)
  file_ideality_score: 50.0
  bits_in_window_256: 20.0
  ideality_efficiency: 15.0
  predictability_score: 10.0

  # Entropy metrics (penalize high entropy)
  entropy_global: -30.0
  shannon_entropy_windowed_256: -15.0
  relative_entropy: -10.0
  conditional_entropy_order1: -20.0

  # Compression metrics (reward compressibility)
  lz77_ratio: 25.0
  lzma_ratio: 20.0
  compression_efficiency: 15.0
  redundancy_score: 10.0
  compressibility_index: 15.0

  # Pattern metrics (reward structure)
  autocorrelation_avg: -8.0
  periodicity_score: 5.0
  pattern_richness: 8.0
  self_similarity: 10.0
  structure_regularity: 12.0

  # Bitwise metrics
  bit_entropy: -5.0
  bit_autocorrelation: -3.0
  bit_pattern_diversity: 5.0

  # Structure metrics
  alignment_score: 8.0
  block_detection_score: 10.0
  segmentation_score: 6.0
  pattern_coherence: 7.0

  # Run-length metrics
  run_efficiency: 8.0
  compression_potential: 10.0
  homogeneity_index: 5.0

  # Statistical metrics
  chi_square_p_value: 3.0
  std_deviation: -2.0
  js_divergence_uniform: -5.0

  # Complexity metrics (penalize complexity)
  kolmogorov_complexity_estimate: -8.0
  lz_complexity: -6.0
  algorithmic_complexity: -7.0
  predictive_complexity: -5.0

# Advanced optimization settings
optimization_settings:
  # Multi-objective optimization
  multi_objective:
    enabled: true
    objectives: ["accuracy", "efficiency", "robustness"]
    weights: [0.4, 0.3, 0.3]
    pareto_optimization: true

  # Adaptive learning
  adaptive_learning:
    enabled: true
    learning_rate: 0.01
    adaptation_window: 100
    performance_feedback: true

  # Exploration vs exploitation balance
  exploration_exploitation:
    exploration_rate: 0.2
    exploitation_rate: 0.8
    decay_rate: 0.995
    minimum_exploration: 0.05

# Risk management
risk_management:
  # Risk assessment
  risk_assessment:
    enabled: true
    risk_categories: ["performance", "quality", "resource"]
    risk_thresholds: [0.1, 0.05, 0.15]

  # Mitigation strategies
  mitigation:
    fallback_strategies: ["graceful_degradation", "alternative_methods"]
    recovery_procedures: true
    rollback_mechanisms: true

  # Safety constraints
  safety_constraints:
    max_acceptable_risk: 0.1
    risk_monitoring_interval: 10
    emergency_stop_threshold: 0.2

# Scalability and performance
scalability:
  # Horizontal scaling
  horizontal_scaling:
    enabled: true
    auto_scaling: true
    scale_up_threshold: 0.8
    scale_down_threshold: 0.3
    max_instances: 10

  # Vertical scaling
  vertical_scaling:
    enabled: true
    resource_boost_factor: 2.0
    memory_scaling_enabled: true
    cpu_scaling_enabled: true

  # Load balancing
  load_balancing:
    method: "round_robin"
    health_check_interval: 30
    failover_enabled: true

# Optimization targets
targets:
  file_ideality_score: maximize
  bits_in_window_256: maximize
  entropy_global: minimize
  lz77_ratio: minimize
  autocorrelation_avg: minimize
  pattern_richness: maximize
  structure_regularity: maximize
  compression_efficiency: maximize
  bit_entropy: minimize
  alignment_score: maximize
  run_efficiency: maximize
  kolmogorov_complexity_estimate: minimize

# Budget constraints
budget:
  max_operations: 1000
  max_cost: 10000
  max_time_seconds: 3600
  resource_budgets:
    cpu_budget: 100
    memory_budget: 1024
    io_budget: 1000

# Operation constraints (optional)
allowed_operations: null  # null means all operations allowed
operation_limit: null      # null means no limit on operation types

# Enhanced error handling
error_handling:
  # Error classification
  error_classification:
    critical_errors: ["memory_exhaustion", "invalid_input", "system_failure"]
    warning_errors: ["performance_degradation", "timeout", "resource_pressure"]
    info_errors: ["minor_inconsistencies", "suboptimal_performance"]

  # Recovery strategies
  recovery_strategies:
    retry_mechanisms: true
    alternative_paths: true
    graceful_degradation: true
    user_notification: true

  # Error logging and tracking
  error_tracking:
    detailed_logging: true
    error_aggregation: true
    trend_analysis: true
    alert_generation: true

# Configuration management
configuration:
  # Dynamic configuration
  dynamic_config:
    enabled: true
    hot_reload: true
    validation_required: true
    rollback_on_error: true

  # Configuration validation
  validation:
    schema_validation: true
    consistency_checks: true
    dependency_validation: true

  # Version management
  version_management:
    track_config_versions: true
    migration_support: true
    backward_compatibility: true

# Monitoring and analytics
monitoring:
  # Real-time monitoring
  real_time_monitoring:
    enabled: true
    metrics_collection_interval: 1.0
    alert_generation: true

  # Historical analysis
  historical_analysis:
    enabled: true
    data_retention_days: 90
    trend_analysis: true
    anomaly_detection: true

  # Performance analytics
  performance_analytics:
    benchmarking: true
    comparison_analysis: true
    optimization_suggestions: true