name: "Simulated Annealing"
description: "Temperature-based search that can accept worse moves"

# Temperature parameters
temperature:
  # Starting temperature
  initial_temperature: 1000.0

  # Minimum temperature
  min_temperature: 0.001

  # Temperature cooling schedule
  cooling_schedule: "exponential"  # Options: "geometric", "linear", "exponential"

  # Geometric cooling rate
  cooling_rate: 0.95

  # Linear cooling decrement
  linear_decrement: 0.5

  # Exponential cooling parameters
  exponential_alpha: 0.99

  # New: Adaptive temperature adjustment
  adaptive_cooling: true

# Restart strategy enhancements
restart_strategy:
  # Enable reheating when stuck
  enable_reheating: true

  # Reheat when no improvement for N iterations
  reheat_threshold: 50

  # Reheat temperature multiplier
  reheat_multiplier: 0.5

  # Maximum number of reheats
  max_reheats: 5

  # New: Restart threshold if stuck in local optimum
  restart_threshold: 0.01

# Acceptance criteria
acceptance:
  # Always accept improvements
  always_accept_improvements: true

  # Temperature-based acceptance probability
  use_boltzmann: true

  # Custom acceptance function
  custom_acceptance: false

  # Accept equal scores with probability
  accept_equal_probability: 0.1

# Restarts and reheating
restart_strategy:
  # Enable reheating when stuck
  enable_reheating: true

  # Reheat when no improvement for N iterations
  reheat_threshold: 50

  # Reheat temperature multiplier
  reheat_multiplier: 0.5

  # Maximum number of reheats
  max_reheats: 5

# Adaptive parameters
adaptive:
  # Adjust cooling rate based on performance
  adaptive_cooling_rate: true

  # Performance evaluation window
  performance_window: 20

  # Target acceptance rate
  target_acceptance_rate: 0.4

  # Cooling rate adjustment
  cooling_adjustment: 0.1

# Exploration vs exploitation
exploration:
  # High temperature exploration operations
  high_temp_operations: ["shuffle_bytes", "reverse_bytes", "base64_encode"]

  # Low temperature exploitation operations
  low_temp_operations: ["xor_constant", "toggle_bit", "clear_bit"]

  # Temperature thresholds for operation selection
  high_temp_threshold: 50.0
  low_temp_threshold: 5.0

# Termination
termination:
  # Converge if temperature below threshold
  temperature_convergence: true

  # Converge if no improvement for N iterations
  improvement_convergence: true

  # Maximum iterations
  max_iterations: 2000

  # Maximum time
  max_time_seconds: 7200