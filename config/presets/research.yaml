# Enhanced Research Preset
name: "Enhanced Research Preset"
description: "Research and experimentation preset with comprehensive analysis tools and advanced experimentation support"

# Enhanced research configuration
research_configuration:
  experimentation:
    ablation_studies: true
    sensitivity_analysis: true
    statistical_testing: true
    reproducibility_checks: true
    hypothesis_testing: true
    experimental_design: "factorial"

  # Exploration parameters
  exploration_parameters:
    strategy: "mcts"
    exploration_rate: 0.4
    novelty_search: true
    diversity_maintenance: 0.3
    curiosity_driven: true
    intrinsic_motivation: true

  # Advanced analysis tools
  analysis_tools:
    visualization: true
    statistical_analysis: true
    result_logging: "detailed"
    experiment_tracking: "mlflow"
    interactive_analysis: true

# Validation settings
validation_settings:
  cross_validation: true
  bootstrap_testing: true
  permutation_importance: true
  feature_ablation: true
  statistical_significance: true
  effect_size_analysis: true

# Advanced strategy ensemble
strategy:
  type: "ensemble"
  strategies:
    - name: "mcts"
      weight: 0.3
      parameters:
        max_iterations: 3000
        exploration_constant: 1.41
        rollout_depth: 100
        backpropagation_depth: 50

    - name: "genetic"
      weight: 0.25
      parameters:
        population_size: 200
        generations: 300
        mutation_rate: 0.1
        crossover_rate: 0.8
        elitism_rate: 0.1

    - name: "neural_network"
      weight: 0.2
      parameters:
        architecture: "deep_residual"
        layers: [256, 128, 64, 32]
        learning_rate: 0.0005
        epochs: 300
        batch_size: 64

    - name: "annealing"
      weight: 0.15
      parameters:
        initial_temperature: 1000.0
        cooling_rate: 0.95
        min_temperature: 0.001
        adaptive_cooling: true

    - name: "beam_search"
      weight: 0.1
      parameters:
        beam_width: 30
        max_depth: 200
        pruning_threshold: 0.6
        diversity_bonus: 0.2

# Comprehensive cost model for research
cost_model:
  type: "multi_objective"
  computational_weight: 0.3
  accuracy_weight: 0.4
  business_weight: 0.1
  research_weight: 0.2

  # Research-specific cost factors
  research_factors:
    novelty_bonus: 0.3
    reproducibility_penalty: 0.1
    statistical_significance_bonus: 0.2
    publication_potential: 0.1

# Research policy with extensive validation
policy:
  type: "entropy"  # Good for exploration
  exploration_policies:
    information_gain:
      entropy_weight: 1.5
      mutual_information_threshold: 0.1
      novelty_bonus: 0.2
      diversity_penalty: 0.05

  # Research-specific objectives
  research_objectives:
    - type: "novelty_maximization"
      weight: 0.3
      direction: "maximize"
    - type: "understanding_insights"
      weight: 0.25
      direction: "maximize"
    - type: "statistical_significance"
      weight: 0.2
      direction: "maximize"
    - type: "reproducibility"
      weight: 0.15
      direction: "maximize"
    - type: "performance"
      weight: 0.1
      direction: "maximize"

# Comprehensive metrics for research
metrics:
  # Core performance metrics
  primary:
    - "file_ideality_score"
    - "entropy_global"
    - "lz77_ratio"
    - "compression_efficiency"

  # Research-specific metrics
  research_metrics:
    - "novelty_score"
    - "information_gain"
    - "pattern_discovery_rate"
    - "hypothesis_generation_score"
    - "reproducibility_index"

  # Statistical metrics
  statistical_metrics:
    - "effect_size"
    - "confidence_intervals"
    - "p_values"
    - "statistical_power"
    - "bayesian_factors"

  # Exploration metrics
  exploration_metrics:
    - "diversity_score"
    - "coverage_ratio"
    - "exploration_efficiency"
    - "discovery_rate"

# Complete operation set for research
operations:
  allowed:
    # Basic operations
    - "xor_constant"
    - "add_constant"
    - "sub_constant"
    - "rotate_left"
    - "rotate_right"
    - "not_bytes"

    # Advanced operations
    - "move_to_front"
    - "burrows_wheeler"
    - "bitplane_extract"
    - "shuffle_bytes"
    - "block_reverse"
    - "delta_encode"
    - "substitution_ops"
    - "transform_ops"
    - "pattern_replacement"
    - "byte_swap"

    # Research-specific operations
    - "experimental_transform"
    - "custom_operation"
    - "parameter_sweep"

  # Comprehensive parameter ranges
  parameter_ranges:
    xor_constant:
      key: [0, 255]
    add_constant:
      constant: [0, 255]
    rotate_left:
      bits: [1, 7]
    substitution_ops:
      pattern_length: [1, 16]
      replacement_length: [1, 16]
    experimental_transform:
      param1: [0.0, 1.0]
      param2: [1, 100]
      param3: ["option1", "option2", "option3"]

# Research-specific limits
limits:
  max_operations: 10000
  max_cost: 100000
  max_time: 7200  # 2 hours for deep research
  max_memory_mb: 4096
  min_improvement: 0.000001
  convergence_threshold: 0.0000001
  stagnation_limit: 3000
  research_depth: "maximum"

# Advanced research settings
research_settings:
  # Experimental design
  experimental_design:
    design_type: "factorial"
    factors: ["strategy", "parameters", "cost_model", "policy"]
    levels: [3, 5, 4, 3]
    replications: 10
    randomization: true
    blocking: true

  # Statistical analysis
  statistical_analysis:
    significance_level: 0.05
    multiple_comparison_correction: "bonferroni"
    effect_size_threshold: 0.2
    confidence_level: 0.95
    power_analysis: true

  # Reproducibility
  reproducibility:
    random_seed_fixed: false
    deterministic_mode: false
    environment_tracking: true
    dependency_tracking: true
    version_control: true

# Comprehensive output configuration
output:
  save_models: true
  save_training_data: true
  save_performance_metrics: true
  save_research_data: true
  generate_visualizations: true
  export_detailed_reports: true
  create_publication_ready_output: true

  output_directory: "results/research/"
  model_directory: "models/research/"
  data_directory: "inputs/research/"
  figures_directory: "figures/research/"
  reports_directory: "reports/research/"

  # Research-specific outputs
  generate_latex_reports: true
  generate_csv_data: true
  generate_json_metadata: true
  generate_bibliography: true
  generate_interactive_notebooks: true

# Comprehensive logging
logging:
  level: "DEBUG"
  file_logging: true
  console_logging: true
  log_performance_metrics: true
  log_research_insights: true
  log_detailed_statistics: true
  log_model_parameters: true
  log_intermediate_results: true

  # Research-specific logging
  research_logging:
    experiment_tracking: true
    hypothesis_testing: true
    statistical_analysis: true
    reproducibility_checks: true

# Advanced validation
validation:
  cross_validation: true
  bootstrap_testing: true
  permutation_importance: true
  feature_ablation: true
  statistical_significance: true

  # Research validation
  research_validation:
    peer_review_simulation: true
    replication_studies: true
    meta_analysis: true
    systematic_review: true

# Research dependencies
dependencies:
  required:
    - "numpy>=1.21.0"
    - "scipy>=1.7.0"
    - "matplotlib>=3.4.0"
    - "seaborn>=0.11.0"
    - "psutil>=5.8.0"
    - "click>=8.0.0"
    - "tqdm>=4.62.0"
    - "pyyaml>=5.4.0"
    - "pillow>=8.3.0"
    - "pandas>=1.3.0"
    - "scikit-learn>=1.0.0"

  research_specific:
    - "torch>=1.9.0"
    - "tensorflow>=2.6.0"
    - "jupyter>=1.0.0"
    - "ipywidgets>=7.6.0"
    - "plotly>=5.0.0"
    - "bokeh>=2.4.0"
    - "networkx>=2.6.0"

  analysis_tools:
    - "statsmodels>=0.12.0"
    - "sympy>=1.8.0"
    - "numba>=0.54.0"
    - "cython>=0.29.0"
    - "mlflow>=1.20.0"

# Experiment tracking
experiment_tracking:
  # MLflow integration
  mlflow:
    enabled: true
    tracking_uri: "http://localhost:5000"
    experiment_name: "bsee_research"
    run_name: "auto_generate"
    tracking_parameters: true
    tracking_metrics: true
    tracking_artifacts: true

  # Weights & Biases integration (optional)
  wandb:
    enabled: false  # Set to true to use W&B
    project: "bsee_research"
    entity: "your_entity"
    config_tracking: true

# Publication support
publication_support:
  # Figure generation
  figures:
    formats: ["png", "pdf", "svg", "eps"]
    dpi: 300
    quality: "publication"
    color_schemes: ["default", "colorblind", "grayscale"]

  # Table generation
  tables:
    formats: ["csv", "latex", "html", "markdown"]
    include_statistics: true
    include_confidence_intervals: true

  # Report generation
  reports:
    formats: ["html", "pdf", "latex", "markdown"]
    include_bibliography: true
    include_appendices: true
    citation_style: "apa"

# Interactive analysis
interactive_analysis:
  # Jupyter notebook support
  jupyter:
    enabled: true
    auto_generate_notebooks: true
    notebook_templates: true
    widget_support: true

  # Dashboard support
  dashboard:
    enabled: true
    framework: "streamlit"  # Options: "streamlit", "dash", "voila"
    real_time_updates: true
    interactive_plots: true

# Configuration metadata
metadata:
  version: "2.0.0"
  created_by: "BSEE Research Team"
  created_date: "2024-01-01"
  last_updated: "2024-01-01"
  compatible_bsee_version: "2.0.0"
  tags: ["research", "experimentation", "analysis", "comprehensive"]

  # Research profile
  research_profile:
    complexity: "very_high"
    resource_requirements: "high"
    accuracy_potential: "very_high"
    exploration_potential: "maximum"
    reproducibility: "high"

# Usage guidelines
usage_guidelines:
  # When to use this preset
  recommended_for:
    - Academic research
    - Industrial R&D
    - Algorithm development
    - Pattern discovery
    - Hypothesis testing

  # Research workflow
  research_workflow:
    1. "Define research questions and hypotheses"
    2. "Configure experimental parameters"
    3. "Run comprehensive experiments"
    4. "Analyze results statistically"
    5. "Validate findings through replication"
    6. "Document and publish results"

  # Best practices
  best_practices:
    - "Document all experimental parameters"
    - "Use proper statistical methods"
    - "Ensure reproducibility through version control"
    - "Validate findings through multiple approaches"
    - "Share data and code for transparency"