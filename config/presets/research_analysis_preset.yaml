# Research Analysis Preset
# Comprehensive configuration for deep binary analysis and research

name: "Research Analysis"
description: "Comprehensive research-grade analysis with extensive metrics, logging, and detailed reporting"
version: "1.0"
author: "BSEE Research Team"

# Advanced Strategy Configuration
strategy:
  type: "ensemble"
  strategies:
    - name: "mcts"
      weight: 0.25
      parameters:
        max_iterations: 2000
        exploration_constant: 1.41
        rollout_depth: 50
        backpropagation_depth: 50

    - name: "genetic"
      weight: 0.20
      parameters:
        population_size: 100
        generations: 200
        mutation_rate: 0.15
        crossover_rate: 0.8
        elitism_rate: 0.1

    - name: "neural_network"
      weight: 0.20
      parameters:
        input_size: 256
        hidden_sizes: [256, 128, 64, 32]
        output_size: 128
        learning_rate: 0.0005
        epochs: 200
        batch_size: 64

    - name: "annealing"
      weight: 0.15
      parameters:
        initial_temperature: 1000.0
        cooling_rate: 0.95
        min_temperature: 0.01
        iterations_per_temp: 100

    - name: "beam"
      weight: 0.10
      parameters:
        beam_width: 20
        max_depth: 200
        pruning_threshold: 0.7

    - name: "heuristic"
      weight: 0.10
      parameters:
        max_iterations: 500
        pattern_detection: true
        statistical_analysis: true

  ensemble_method: "weighted_voting"
  consensus_threshold: 0.6

# Comprehensive Cost Model
cost_model:
  type: "multi_objective"
  parameters:
    # Research-grade cost analysis
    computational:
      weight: 0.25
      complexity_analysis: true
      algorithm_complexity_factors:
        linear: 1.0
        logarithmic: 1.2
        quadratic: 2.0
        exponential: 5.0

    memory:
      weight: 0.20
      detailed_memory_tracking: true
      memory_profiling: true
      cache_analysis: true

    time:
      weight: 0.20
      performance_profiling: true
      bottleneck_detection: true
      parallel_analysis: true

    quality:
      weight: 0.20
      quality_metrics:
        structural_integrity: 0.3
        information_preservation: 0.3
        transformation_effectiveness: 0.2
        reversibility: 0.2

    research:
      weight: 0.15
      metrics:
        novelty_score: 0.4
        scientific_value: 0.3
        reproducibility: 0.3

    optimization_mode: "pareto_optimal"
    constraint_mode: "hard"
    adaptive_learning: true
    learning_rate: 0.02

# Research-Grade Policy
policy:
  type: "multi_objective"
  mode: "exploratory"
  adaptive_weights: true
  weight_adaptation_rate: 0.02
  performance_window: 100
  exploration_rate: 0.3
  research_mode: true

  comprehensive_objectives:
    - type: "score_improvement"
      weight: 0.20
      direction: "maximize"
      priority: 1
    - type: "novelty_discovery"
      weight: 0.15
      direction: "maximize"
      priority: 2
    - type: "pattern_analysis"
      weight: 0.15
      direction: "maximize"
      priority: 3
    - type: "structural_insights"
      weight: 0.15
      direction: "maximize"
      priority: 4
    - type: "cost_efficiency"
      weight: 0.10
      direction: "maximize"
      priority: 5
    - type: "time_efficiency"
      weight: 0.10
      direction: "maximize"
      priority: 6
    - type: "memory_efficiency"
      weight: 0.05
      direction: "maximize"
      priority: 7
    - type: "reproducibility"
      weight: 0.10
      direction: "maximize"
      priority: 8

  research_constraints:
    max_cost_per_operation: 1000.0
    max_time_per_operation: 30.0
    min_improvement_threshold: 0.00001
    max_consecutive_failures: 50
    memory_limit_mb: 2048
    research_depth_limit: 10000
  constraint_mode: "hard"

# Comprehensive Metrics Suite
metrics:
  primary:
    - "file_ideality_score"
    - "entropy_global"
    - "lz77_ratio"
    - "compression_efficiency"
    - "pattern_density"

  structural:
    - "bitwise_distribution"
    - "byte_transition_entropy"
    - "run_length_encoding_efficiency"
    - "autocorrelation_analysis"
    - "fourier_transform_analysis"

  informational:
    - "shannon_entropy"
    - "kolmogorov_complexity"
    - "algorithmic_complexity"
    - "information_content"
    - "mutual_information"

  statistical:
    - "mean_absolute_deviation"
    - "standard_deviation"
    - "skewness"
    - "kurtosis"
    - "correlation_analysis"

  pattern:
    - "repeating_patterns"
    - "anomaly_detection"
    - "periodicity_analysis"
    - "fractal_dimension"
    - "self_similarity"

  research:
    - "novelty_score"
    - "scientific_interest"
    - "discovery_potential"
    - "hypothesis_generation"

  optimization_direction:
    file_ideality_score: "max"
    entropy_global: "min"
    lz77_ratio: "max"
    compression_efficiency: "max"
    pattern_density: "max"
    novelty_score: "max"
    scientific_interest: "max"

# Complete Operation Set
operations:
  allowed:
    # Basic operations
    - "xor"
    - "add_constant"
    - "sub_constant"
    - "rotate"
    - "reverse"
    - "bit_swap"

    # Advanced operations
    - "substitute"
    - "transpose"
    - "compress"
    - "decompress"
    - "pattern_match"
    - "entropy_encode"

    # Research operations
    - "fourier_transform"
    - "wavelet_transform"
    - "fractal_analysis"
    - "chaos_analysis"

  comprehensive_parameters:
    xor:
      key: [0, 255]
      key_distribution: "uniform"
    add_constant:
      constant: [0, 255]
      constant_distribution: "gaussian"
    sub_constant:
      constant: [0, 255]
      constant_distribution: "gaussian"
    rotate:
      bits: [1, 7]
      bit_direction: ["left", "right"]
    substitute:
      pattern_length: [1, 16]
      replacement_length: [1, 16]
      pattern_types: ["bytes", "bits", "nibbles"]
    compress:
      level: [1, 9]
      algorithm: ["lz4", "zstd", "gzip", "brotli", "lzma"]
    fourier_transform:
      window_size: [8, 16, 32, 64, 128, 256]
      transform_type: ["dft", "fft", "dct", "dst"]

# Research-Grade Limits
limits:
  max_operations: 50000
  max_cost: 500000
  max_time: 3600  # 1 hour for deep analysis
  max_memory_mb: 4096
  min_improvement: 0.000001
  convergence_threshold: 0.0000001
  stagnation_limit: 2000
  research_depth: "maximum"

# Advanced Research Settings
research_settings:
  # Deep analysis
  enable_deep_analysis: true
  analysis_depth: "comprehensive"
  cross_validation: true
  statistical_significance: true

  # Pattern discovery
  pattern_discovery: true
  anomaly_detection: true
  novelty_detection: true
  hypothesis_testing: true

  # Reproducibility
  random_seed_fixed: false
  deterministic_mode: false
  reproducibility_checks: true

  # Validation
  internal_validation: true
  external_validation: true
  peer_review_simulation: true

# Comprehensive Output Configuration
output:
  save_models: true
  save_training_data: true
  save_performance_metrics: true
  save_research_data: true
  generate_visualizations: true
  export_detailed_reports: true
  create_publication_ready_output: true

  output_directory: "results/research/"
  model_directory: "models/research/"
  data_directory: "data/research/"
  figures_directory: "figures/research/"
  reports_directory: "reports/research/"

  # Research outputs
  generate_latex_reports: true
  generate_csv_data: true
  generate_json_metadata: true
  generate_bibliography: true

# Comprehensive Logging
logging:
  level: "DEBUG"
  file_logging: true
  console_logging: true
  log_performance_metrics: true
  log_research_insights: true
  log_detailed_statistics: true
  log_model_parameters: true
  log_intermediate_results: true

  log_files:
    main_log: "research_analysis.log"
    performance_log: "performance.log"
    research_log: "research_insights.log"
    error_log: "errors.log"
    debug_log: "debug.log"

# Advanced Validation and Testing
validation:
  cross_validation: true
  test_split: 0.3
  validation_strategies: ["k_fold", "bootstrap", "holdout"]
  validation_metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "auc_roc"
    - "convergence_rate"
    - "stability_index"
    - "reproducibility_score"

  comprehensive_benchmarking:
    enabled: true
    compare_with_all_strategies: true
    benchmark_datasets: ["structured", "random", "compressed", "mixed"]
    statistical_analysis: true
    significance_testing: true

# Research Dependencies
dependencies:
  required:
    - "numpy>=1.21.0"
    - "scipy>=1.7.0"
    - "matplotlib>=3.4.0"
    - "seaborn>=0.11.0"
    - "psutil>=5.8.0"
    - "click>=8.0.0"
    - "tqdm>=4.62.0"
    - "pyyaml>=5.4.0"
    - "pillow>=8.3.0"
    - "pandas>=1.3.0"
    - "scikit-learn>=1.0.0"

  research_specific:
    - "torch>=1.9.0"
    - "tensorflow>=2.6.0"
    - "jupyter>=1.0.0"
    - "ipywidgets>=7.6.0"
    - "plotly>=5.0.0"
    - "bokeh>=2.4.0"
    - "networkx>=2.6.0"
    - "igraph>=0.9.0"

  analysis_tools:
    - "statsmodels>=0.12.0"
    - "sympy>=1.8.0"
    - "numba>=0.54.0"
    - "cython>=0.29.0"

  visualization:
    - "plotly>=5.0.0"
    - "bokeh>=2.4.0"
    - "altair>=4.1.0"
    - "pygal>=2.1.0"

# Publication Support
publication_support:
  generate_figures: true
  figure_formats: ["png", "pdf", "svg"]
  figure_dpi: 300
  figure_quality: "publication"

  generate_tables: true
  table_formats: ["csv", "latex", "html"]

  generate_reports: true
  report_formats: ["html", "pdf", "latex", "markdown"]
  citation_style: "apa"
  bibliography_format: "bibtex"

# Advanced Error Handling
error_handling:
  comprehensive_error_logging: true
  error_analysis: true
  error_recovery_strategies: ["retry", "fallback", "skip", "abort"]
  max_recovery_attempts: 5
  error_classification: true

# Research Platform Support
platform:
  windows_optimized: true
  linux_optimized: true
  macos_optimized: true
  cross_platform_compatibility: true

  high_performance_computing: true
  cluster_computing: true
  distributed_computing: false

# Research Compatibility
compatibility:
  python_version: ">=3.9"
  platforms: ["windows", "linux", "macos"]
  architecture: ["x86_64", "arm64"]
  research_environment: true

# Version and Metadata
version_info:
  preset_version: "1.0.0"
  bsee_version: "2.0.0"
  research_version: "1.0.0"
  last_updated: "2024-01-01"
  authors: ["BSEE Research Team"]
  license: "MIT"
  doi: "10.5281/zenodo.xxxxxx"

  changelog: |
    - Research analysis preset implementation
    - Ensemble strategy integration
    - Comprehensive metrics suite
    - Advanced validation framework
    - Publication-ready output generation
    - Cross-platform research support
    - Extensive documentation and metadata