# BSEE Continuous Integration Pipeline Configuration
# This file defines the CI/CD pipeline for automated testing and validation

name: BSEE CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '16'
  JAVA_VERSION: '11'

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Code formatting check (Black)
      run: |
        black --check --diff src tests

    - name: Import sorting check (isort)
      run: |
        isort --check-only --diff src tests

    - name: Linting (Flake8)
      run: |
        flake8 src tests --max-line-length=88 --extend-ignore=E203,W503

    - name: Type checking (MyPy)
      run: |
        mypy src --ignore-missing-imports || true

    - name: Security scan (Bandit)
      run: |
        bandit -r src -f json -o bandit-report.json || true
        bandit -r src

    - name: Dependency security scan (Safety)
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock pytest-xdist
        pip install coverage[toml]
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Run unit tests
      run: |
        pytest tests/unit/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=junit-unit.xml \
          -v \
          --tb=short

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == env.PYTHON_VERSION
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: unit-test-results-${{ matrix.python-version }}
        path: |
          junit-unit.xml
          htmlcov/

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Generate test data
      run: |
        python tests/fixtures/test_data_generator.py

    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          --cov=src \
          --cov-append \
          --cov-report=xml \
          --junit-xml=junit-integration.xml \
          -v \
          --tb=short

    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          junit-integration.xml
          coverage.xml

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock pytest-benchmark
        pip install memory-profiler psutil
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Run performance benchmarks
      run: |
        pytest tests/performance/ \
          --benchmark-only \
          --benchmark-json=benchmark-results.json \
          --benchmark-sort=mean \
          -v

    - name: Run operation performance tests
      run: |
        python tests/performance/test_operation_performance.py

    - name: Run strategy benchmarks
      run: |
        python tests/performance/benchmark_strategies.py

    - name: Process benchmark results
      run: |
        python -c "
        import json
        with open('benchmark-results.json', 'r') as f:
            results = json.load(f)
        print('Performance Summary:')
        for benchmark in results.get('benchmarks', []):
            name = benchmark.get('name', 'Unknown')
            mean = benchmark.get('stats', {}).get('mean', 0)
            print(f'  {name}: {mean:.6f}s')
        "

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: |
          benchmark-results.json
          performance_report.json

  # GUI Tests
  gui-tests:
    name: GUI Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install system dependencies for GUI
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install PyQt5 pytest-qt || true
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Run GUI component tests
      run: |
        xvfb-run -a pytest tests/unit/test_gui.py \
          --junit-xml=junit-gui-unit.xml \
          -v \
          --tb=short || true

    - name: Run GUI integration tests
      run: |
        xvfb-run -a pytest tests/integration/test_gui_integration.py \
          --junit-xml=junit-gui-integration.xml \
          -v \
          --tb=short || true

    - name: Upload GUI test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: gui-test-results
        path: |
          junit-gui-unit.xml
          junit-gui-integration.xml

  # Regression Tests
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: [integration-tests, performance-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        if [ -f requirements.txt ]; then pip install -r requirements.txt
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt

    - name: Run regression test suite
      run: |
        python tests/regression/regression_suite.py \
          --output=regression-results.json \
          --baseline=baseline.json \
          --format=json || true

    - name: Run automated validation
      run: |
        python tests/validation/component_validator.py \
          --output=validation-results.json \
          --format=json || true

    - name: Analyze regression results
      run: |
        python -c "
        import json
        import os

        # Load regression results
        regression_file = 'regression-results.json'
        if os.path.exists(regression_file):
            with open(regression_file, 'r') as f:
                regression = json.load(f)
            print(f'Regression Tests: {regression.get(\"passed\", 0)}/{regression.get(\"total\", 0)} passed')

        # Load validation results
        validation_file = 'validation-results.json'
        if os.path.exists(validation_file):
            with open(validation_file, 'r') as f:
                validation = json.load(f)
            print(f'Validation Tests: {validation.get(\"passed\", 0)}/{validation.get(\"total\", 0)} passed')
        "

    - name: Upload regression results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: regression-results
        path: |
          regression-results.json
          validation-results.json

  # Build and Package
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, gui-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
        if [ -f requirements.txt ]; then pip install -r requirements.txt

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-packages
        path: dist/

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser
        if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt

    - name: Build documentation
      run: |
        if [ -d "docs" ]; then
          cd docs
          make html
          cd ..
        else
          echo "No docs directory found, skipping documentation build"
        fi

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: documentation
        path: docs/_build/html/

  # Final Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests, performance-tests, gui-tests, regression-tests]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate test summary
      run: |
        echo "# BSEE CI Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Tests | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| GUI Tests | ${{ needs.gui-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Regression Tests | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Check overall status
      run: |
        if [[ "${{ needs.code-quality.result }}" == "success" &&
              "${{ needs.unit-tests.result }}" == "success" &&
              "${{ needs.integration-tests.result }}" == "success" &&
              "${{ needs.performance-tests.result }}" == "success" &&
              "${{ needs.gui-tests.result }}" == "success" &&
              "${{ needs.regression-tests.result }}" == "success" ]]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Some tests failed!"
          exit 1
        fi

  # Release (only on tags)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docs, test-summary]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist-packages
        path: dist/

    - name: Download documentation
      uses: actions/download-artifact@v3
      with:
        name: documentation
        path: docs-built/

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/
        asset_name: bsee-packages
        asset_content_type: application/zip